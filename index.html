
<!-- BBVERSO: ARMADURA, SHADERS E MÚSICA -->
<style>
  #bbv-audio {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 9999;
    background: #101827ee;
    color: white;
    padding: 12px;
    border: 1px solid #43eaff;
    border-radius: 14px;
    font: 14px sans-serif;
  }
  #bbv-audio button {
    background: #123b55;
    color: white;
    border: 1px solid #43eaff;
    border-radius: 8px;
    padding: 7px;
    margin: 3px;
  }
  #bbv-volume { width: 100px; vertical-align: middle; }
  #bbv-status { color: #7ef7ff; font-size: 12px; }
</style>

<div id="bbv-audio">
  <b>🎮 BBVerso Sound</b><br>
  <button id="bbv-play">▶ Música</button>
  <button id="bbv-race">🏎️ Corrida</button>
  <button id="bbv-stop">■ Parar</button><br>
  Volume <input id="bbv-volume" type="range"
    min="0" max="1" step="0.05" value="0.55">
  <div id="bbv-status">Toque em Música para começar</div>
</div>

<script>
(() => {
  const status = document.getElementById('bbv-status');
  const volume = document.getElementById('bbv-volume');
  let ctx, master, timer, step = 0, mode = 'adventure';

  function startAudio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = Number(volume.value);
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  volume.addEventListener('input', () => {
    if (master) master.gain.value = Number(volume.value);
  });

  function note(freq, duration, type, gain, when) {
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, when);
    amp.gain.setValueAtTime(0.0001, when);
    amp.gain.exponentialRampToValueAtTime(gain, when + 0.015);
    amp.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    osc.connect(amp);
    amp.connect(master);
    osc.start(when);
    osc.stop(when + duration + 0.03);
  }

  function beat() {
    if (!ctx) return;
    const t = ctx.currentTime;
    if (mode === 'race') {
      // Trilha eletrônica original, acelerada e com clima de drift.
      if (step % 4 === 0) note(65, .16, 'sine', .55, t);
      if (step % 2 === 0) note(110, .08, 'triangle', .18, t);
      const bass = [55,55,73.42,55,82.41,55,73.42,65.41];
      note(bass[step % bass.length], .18, 'sawtooth', .12, t);
      const lead = [220,261.63,329.63,293.66,220,196,246.94,293.66];
      if (step % 2 === 0)
        note(lead[(step / 2) % lead.length], .12, 'square', .055, t);
    } else {
      // Música ambiente original para explorar o mundo.
      const chords = [
        [261.63,329.63,392],
        [220,261.63,329.63],
        [174.61,220,261.63],
        [196,246.94,293.66]
      ];
      const chord = chords[Math.floor(step / 4) % chords.length];
      if (step % 4 === 0) {
        chord.forEach((f, i) =>
          note(f, 1.15, 'sine', .13, t + i * .035)
        );
      }
      const melody = [523.25,392,440,329.63,392,293.66,329.63,261.63];
      note(melody[step % melody.length], .32, 'triangle', .13, t);
    }
    step++;
  }

  function play(which) {
    startAudio();
    clearInterval(timer);
    mode = which;
    step = 0;
    beat();
    timer = setInterval(beat, which === 'race' ? 180 : 480);
    status.textContent = which === 'race'
      ? '🏎️ Trilha eletrônica de corrida'
      : '🌄 Música de aventura';
  }

  document.getElementById('bbv-play').onclick = () => play('adventure');
  document.getElementById('bbv-race').onclick = () => play('race');
  document.getElementById('bbv-stop').onclick = () => {
    clearInterval(timer);
    status.textContent = 'Música parada';
  };

  // API para conectar com os botões e eventos do seu jogo.
  window.BBVersoAudio = {
    adventure: () => play('adventure'),
    race: () => play('race'),
    stop: () => {
      clearInterval(timer);
      status.textContent = 'Música parada';
    }
  };
})();
</script>

<script>
/*
 SHADER DE ENERGIA PARA THREE.JS
 Para usar no material da armadura:
 const material = new THREE.ShaderMaterial({
   uniforms: { time: { value: 0 } },
   vertexShader: BBV_ARMOR_VERTEX,
   fragmentShader: BBV_ARMOR_FRAGMENT,
   transparent: true
 });
 Atualize material.uniforms.time.value = clock.getElapsedTime()
 a cada frame.
*/
window.BBV_ARMOR_VERTEX = `
  varying vec3 vNormal;
  varying vec3 vPosition;
  void main() {
    vNormal = normalize(normalMatrix * normal);
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vPosition = mvPosition.xyz;
    gl_Position = projectionMatrix * mvPosition;
  }
`;

window.BBV_ARMOR_FRAGMENT = `
  uniform float time;
  varying vec3 vNormal;
  varying vec3 vPosition;

  void main() {
    vec3 viewDir = normalize(-vPosition);
    float rim = pow(1.0 - abs(dot(normalize(vNormal),
                                  viewDir)), 2.5);
    float pulse = 0.65 + 0.35 * sin(time * 4.0);
    float lines = sin((vPosition.y + time * 0.8) * 35.0);
    float energy = smoothstep(0.15, 0.95, lines) * 0.22;
    vec3 metal = vec3(0.035, 0.09, 0.15);
    vec3 cyan = vec3(0.05, 0.8, 1.0);
    vec3 color = metal + cyan * (rim * pulse + energy);
    gl_FragColor = vec4(color, 0.96);
  }
`;
</script>
