
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10243a">
<title>Bebeverso Beta</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:system-ui,Arial;background:#87ceeb;color:white}
canvas{display:block}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.panel{background:#10243ad9;padding:10px 13px;border-radius:14px;box-shadow:0 3px 12px #0003}
#hint{position:fixed;top:66px;left:50%;transform:translateX(-50%);text-align:center;background:#10243ac9;border-radius:12px;padding:8px 12px;max-width:90%;font-size:13px}
button{border:0;border-radius:14px;background:#ffffffeb;color:#10243a;font-size:16px;font-weight:800;padding:12px;touch-action:none;box-shadow:0 3px 8px #0003}
button:active{background:#9ef5b7;transform:scale(.96)}
#controls{position:fixed;bottom:15px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.cluster{display:grid;grid-template-columns:repeat(3,54px);gap:5px;pointer-events:auto}
.cluster button{height:52px;padding:3px;font-size:22px}
.actions{display:flex;flex-direction:column;gap:8px;pointer-events:auto;align-items:stretch}
.actions button{min-width:94px}
#menu{position:fixed;inset:0;background:#0d2039dc;display:flex;align-items:center;justify-content:center;padding:20px}
#menuBox{width:min(420px,100%);background:#f7fbff;color:#142c44;border-radius:24px;padding:24px;text-align:center}
#menuBox h1{font-size:34px;margin:0 0 5px}
#menuBox p{line-height:1.45}
#menuBox button{display:block;width:100%;margin-top:10px;background:#d9f7e4}
.small{font-size:12px;opacity:.85}
@media(min-width:800px){.cluster button{width:64px;height:60px}.actions button{min-width:120px}}
</style>
</head>
<body>
<div id="top">
  <div class="panel"><b>🌎 BEBEVERSO</b><div id="mode">Praça central</div></div>
  <button id="menuBtn" style="pointer-events:auto">☰ Menu</button>
</div>
<div id="hint">Explore a praça e entre em um portal!</div>
<div id="controls">
  <div class="cluster">
    <span></span><button data-move="forward">▲</button><span></span>
    <button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button>
  </div>
  <div class="actions">
    <button id="jump">⬆ Pular</button>
    <button id="build">🧱 Construir</button>
    <button id="remove">🪓 Remover</button>
    <button id="interact">🚪 Entrar</button>
  </div>
</div>
<div id="menu">
  <div id="menuBox">
    <h1>🌎 Bebeverso</h1>
    <b>Versão 1.0 Beta · Android</b>
    <p>Um universo 3D para explorar, construir e correr de kart!</p>
    <button id="play">▶ JOGAR</button>
    <button id="creative">⛏️ Ir para o Criativo</button>
    <button id="race">🏎️ Ir para a Corrida</button>
    <p class="small">Protótipo de teste. Precisa de internet para carregar o motor 3D.</p>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bd7ff);
scene.fog = new THREE.Fog(0x8bd7ff, 35, 100);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557044,2));
const sun = new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-12,25,10);
sun.castShadow=true;
scene.add(sun);

const mats = {
 grass:new THREE.MeshStandardMaterial({color:0x58b957}),
 dirt:new THREE.MeshStandardMaterial({color:0x977044}),
 wood:new THREE.MeshStandardMaterial({color:0x80502b}),
 leaves:new THREE.MeshStandardMaterial({color:0x23874a}),
 stone:new THREE.MeshStandardMaterial({color:0x9da9b5}),
 blue:new THREE.MeshStandardMaterial({color:0x168be8}),
 red:new THREE.MeshStandardMaterial({color:0xf04b4b}),
 yellow:new THREE.MeshStandardMaterial({color:0xffd33d}),
 white:new THREE.MeshStandardMaterial({color:0xffffff}),
 dark:new THREE.MeshStandardMaterial({color:0x273747}),
 skin:new THREE.MeshStandardMaterial({color:0xffc69b})
};

let mode='plaza', playing=false, jumpTime=0, vertical=0;
const held={forward:false,back:false,left:false,right:false};
const worldObjects=[];
const buildObjects=[];
const player=new THREE.Group();
scene.add(player);

function cube(parent,material,x,y,z,sx,sy,sz){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function ground(size=100){
 const g=new THREE.Mesh(new THREE.PlaneGeometry(size,size),mats.grass);
 g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
}
function clearWorld(){
 for(const o of worldObjects)scene.remove(o);
 worldObjects.length=0;
 for(const o of buildObjects)scene.remove(o);
 buildObjects.length=0;
}
function addTree(x,z){
 const t=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,7),mats.wood);
 trunk.position.y=1;t.add(trunk);
 const top=new THREE.Mesh(new THREE.ConeGeometry(1.3,2.6,7),mats.leaves);
 top.position.y=2.7;top.castShadow=true;t.add(top);
 t.position.set(x,0,z);scene.add(t);worldObjects.push(t);
}
function addPortal(x,z,kind){
 const p=new THREE.Group();
 const ringMat=new THREE.MeshStandardMaterial({
  color:kind==='race'?0xffb62e:0x37c8ff,
  emissive:kind==='race'?0x9b4200:0x005b99,
  emissiveIntensity:1.1,metalness:.35,roughness:.3
 });
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.25,.18,12,32),ringMat);
 ring.position.y=1.65;p.add(ring);
 const center=new THREE.Mesh(new THREE.CircleGeometry(1.08,32),
  new THREE.MeshBasicMaterial({color:kind==='race'?0x4e8aff:0x4bd5ff,transparent:true,opacity:.45}));
 center.position.y=1.65;center.position.z=-.05;p.add(center);
 cube(p,mats.dark,0,.18,0,2.8,.35,.65);
 if(kind==='race'){
   const kart=new THREE.Group();
   cube(kart,mats.red,0,.45,0,1.05,.35,1.35);
   cube(kart,mats.yellow,0,.72,-.12,.6,.25,.45);
   for(const x of [-.62,.62])for(const z2 of [-.42,.42]){
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.14,12),mats.dark);
    w.rotation.z=Math.PI/2;w.position.set(x,.23,z2);kart.add(w);
   }
   kart.position.set(0,2.15,0);p.add(kart);
 }else{
   cube(p,mats.wood,0,2.2,0,.18,.9,.18);
   const pick=cube(p,mats.stone,.1,2.65,0,.95,.18,.18);
   pick.rotation.z=-.35;
 }
 p.position.set(x,0,z);p.userData.kind=kind;
 scene.add(p);worldObjects.push(p);
}
function makePlayer(){
 player.clear();
 cube(player,mats.blue,0,1.05,0,.72,.8,.42);
 cube(player,mats.skin,0,1.75,0,.58,.58,.58);
 cube(player,mats.dark,0,2.05,0,.62,.18,.62);
 cube(player,mats.dark,-.18,1.8,.3,.08,.08,.04);
 cube(player,mats.dark,.18,1.8,.3,.08,.08,.04);
 cube(player,mats.dark,-.2,.35,0,.23,.7,.25);
 cube(player,mats.dark,.2,.35,0,.23,.7,.25);
 player.position.set(0,0,4);
}
function makeKart(){
 player.clear();
 cube(player,mats.red,0,.45,0,1.3,.42,1.8);
 cube(player,mats.yellow,0,.78,-.15,.7,.25,.65);
 cube(player,mats.dark,0,.9,.48,.65,.12,.45);
 for(const x of [-.72,.72])for(const z of [-.58,.58]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.18,14),mats.dark);
  w.rotation.z=Math.PI/2;w.position.set(x,.28,z);player.add(w);
 }
}
function setupPlaza(){
 clearWorld();ground(100);makePlayer();
 for(let i=0;i<16;i++){
  const a=i*Math.PI/8;
  addTree(Math.sin(a)*15,Math.cos(a)*15);
 }
 addPortal(-5,-4,'creative');
 addPortal(5,-4,'race');
 // path to portals
 const pathMat=new THREE.MeshStandardMaterial({color:0xd7c69b});
 const path=new THREE.Mesh(new THREE.PlaneGeometry(15,3),pathMat);
 path.rotation.x=-Math.PI/2;path.position.set(0,.02,-2);scene.add(path);worldObjects.push(path);
}
function setupCreative(){
 clearWorld();ground(100);makePlayer();
 for(let i=0;i<24;i++){
  const x=(Math.random()-.5)*45,z=(Math.random()-.5)*45;
  if(Math.abs(x)<4&&Math.abs(z)<5)continue;
  addTree(x,z);
 }
 // A few natural hills
 for(let i=0;i<7;i++){
  const hill=new THREE.Mesh(new THREE.SphereGeometry(1,12,8),mats.grass);
  const s=2+Math.random()*4;
  hill.scale.set(s*.9,s*.45,s);
  hill.position.set((Math.random()-.5)*55,s*.25,-15-Math.random()*25);
  scene.add(hill);worldObjects.push(hill);
 }
}
function setupRace(){
 clearWorld();ground(100);makeKart();
 const roadMat=new THREE.MeshStandardMaterial({color:0x414954});
 const lineMat=new THREE.MeshStandardMaterial({color:0xf5f0d4});
 // Four road strips form a simple rectangular circuit
 function road(x,z,sx,sz){
  const r=new THREE.Mesh(new THREE.PlaneGeometry(sx,sz),roadMat);
  r.rotation.x=-Math.PI/2;r.position.set(x,.035,z);scene.add(r);worldObjects.push(r);
 }
 road(0,-12,36,5);road(0,12,36,5);
 road(-15,0,5,24);road(15,0,5,24);
 for(let x=-15;x<=15;x+=3){
  const stripe=new THREE.Mesh(new THREE.PlaneGeometry(1.3,.15),lineMat);
  stripe.rotation.x=-Math.PI/2;stripe.position.set(x,.05,-12);scene.add(stripe);worldObjects.push(stripe);
 }
 for(let i=0;i<12;i++)addTree(-23+i*4,-20);
 player.position.set(0,0,8);
}
function setMode(next){
 mode=next;
 if(next==='plaza')setupPlaza();
 if(next==='creative')setupCreative();
 if(next==='race')setupRace();
 document.getElementById('mode').textContent=
  next==='plaza'?'Praça central':next==='creative'?'Modo Criativo':'Modo Corrida';
 document.getElementById('hint').textContent=
  next==='plaza'?'Chegue perto de um portal ou use Entrar.':
  next==='creative'?'Use Construir e Remover para editar o mundo.':
  'Segure as setas para dirigir seu kart!';
 document.getElementById('build').style.display=next==='creative'?'block':'none';
 document.getElementById('remove').style.display=next==='creative'?'block':'none';
 document.getElementById('interact').style.display=next==='plaza'?'block':'none';
}
function distanceTo(x,z){return Math.hypot(player.position.x-x,player.position.z-z)}
function interact(){
 if(mode!=='plaza')return;
 if(distanceTo(-5,-4)<5)setMode('creative');
 else if(distanceTo(5,-4)<5)setMode('race');
 else document.getElementById('hint').textContent='Aproxime-se do portal com picareta ou do portal com kart!';
}
function buildBlock(){
 if(mode!=='creative')return;
 const forward=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
 const x=Math.round(player.position.x+forward.x*2);
 const z=Math.round(player.position.z+forward.z*2);
 const b=cube(scene,mats.yellow,x,.5,z,1,1,1);
 buildObjects.push(b);
}
function removeBlock(){
 if(!buildObjects.length)return;
 const b=buildObjects.pop();scene.remove(b);
}
function jump(){
 if(jumpTime<=0){vertical=6;jumpTime=1;}
}
function startGame(){
 playing=true;document.getElementById('menu').style.display='none';
 setMode('plaza');
}
document.getElementById('play').onclick=startGame;
document.getElementById('creative').onclick=()=>{startGame();setMode('creative')};
document.getElementById('race').onclick=()=>{startGame();setMode('race')};
document.getElementById('menuBtn').onclick=()=>{document.getElementById('menu').style.display='flex'};
document.getElementById('interact').onclick=interact;
document.getElementById('build').onclick=buildBlock;
document.getElementById('remove').onclick=removeBlock;
document.getElementById('jump').onclick=jump;
document.querySelectorAll('[data-move]').forEach(btn=>{
 const key=btn.dataset.move;
 const on=e=>{e.preventDefault();held[key]=true};
 const off=e=>{e.preventDefault();held[key]=false};
 btn.addEventListener('pointerdown',on);
 btn.addEventListener('pointerup',off);
 btn.addEventListener('pointercancel',off);
 btn.addEventListener('pointerleave',off);
});
window.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'||e.key==='w')held.forward=true;
 if(e.key==='ArrowDown'||e.key==='s')held.back=true;
 if(e.key==='ArrowLeft'||e.key==='a')held.left=true;
 if(e.key==='ArrowRight'||e.key==='d')held.right=true;
 if(e.key===' ')jump();
});
window.addEventListener('keyup',e=>{
 if(e.key==='ArrowUp'||e.key==='w')held.forward=false;
 if(e.key==='ArrowDown'||e.key==='s')held.back=false;
 if(e.key==='ArrowLeft'||e.key==='a')held.left=false;
 if(e.key==='ArrowRight'||e.key==='d')held.right=false;
});
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(.04,clock.getDelta());
 if(playing){
  let speed=mode==='race'?9:5;
  const forward=(held.forward?1:0)-(held.back?1:0);
  const turn=(held.left?1:0)-(held.right?1:0);
  if(mode==='race'){
   player.rotation.y+=turn*dt*2.1*(forward===0?1:Math.sign(forward));
   player.position.x-=Math.sin(player.rotation.y)*forward*speed*dt;
   player.position.z-=Math.cos(player.rotation.y)*forward*speed*dt;
  }else{
   player.position.x+=turn*speed*dt;
   player.position.z-=forward*speed*dt;
  }
  if(jumpTime>0){
   player.position.y+=vertical*dt;
   vertical-=15*dt;
   if(player.position.y<=0){player.position.y=0;jumpTime=0;vertical=0;}
  }
  // Camera follows the player
  const target=new THREE.Vector3(player.position.x,player.position.y+2,player.position.z);
  const behind=new THREE.Vector3(0,6,mode==='race'?11:10);
  behind.applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);
  camera.position.lerp(target.clone().add(behind),.09);
  camera.lookAt(target);
 }
 renderer.render(scene,camera);
}
const clock=new THREE.Clock();
setupPlaza();
camera.position.set(0,7,15);camera.lookAt(0,0,0);
animate();
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
